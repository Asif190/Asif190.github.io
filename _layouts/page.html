---
layout: default
---
{% unless page.hide_title %}
<header class="page-banner">
  <div class="wrap">
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </div>
</header>
{% endunless %}
<article class="wrap page">
  <div class="prose">
    {{ content }}
  </div>
</article>
