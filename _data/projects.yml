# Projects page. "area" groups the projects; "metrics" are short result strings.
# Links you leave empty are hidden. "featured: true" makes the card span the full width.

- title: "HIVE-R: Bio-inspired swarm UAV system for human detection in GPS-denied rescue environments"
  area: Edge vision and robotics
  glyph: drone          # drone | lesion | fusion | qubit | chip | text | shift | lightcurve
  featured: true
  year: ""          # add the year if you know it
  summary: >-
    A "Queen-Worker" multi-UAV framework for search and rescue where GPS is unavailable.
    I optimised and deployed a 6.2 MB YOLOv8n detector on a Raspberry Pi 4, and the team fused
    monocular visual odometry with IMU data through an extended Kalman filter for 6-DoF navigation.
    Detections are geolocated and relayed to the ground station over a 915 MHz MAVLink link.
  metrics: ["86.9% mAP under smoke and dust", "185 ms on-device inference", "< 500 ms end-to-end telemetry latency"]
  tags: [YOLOv8n, Raspberry Pi 4, EKF, Visual odometry, MAVLink]
  links: { code: "https://github.com/Asif190/HIVE-R-Bio-Inspired-SwarmDroneSystemforHumanDetectioninGPS-DeniedRescueEnvironments" }

- title: "Adaptive multimodal sentiment analysis and feedback summarisation"
  area: Multimodal learning and NLP
  glyph: text          # drone | lesion | fusion | qubit | chip | text | shift | lightcurve
  year: "2025"
  summary: >-
    An end-to-end pipeline for analysing course feedback: MAG-BERT for cross-modal fusion,
    LoRA-fine-tuned T5 for parameter-efficient summarisation and suggestion generation,
    and SHAP for explaining which inputs drive each prediction. Published at ICCIT 2025.
  metrics: ["86.4% accuracy, 0.91 AUC, macro-F1 0.87 on 5,000 evaluations"]
  tags: [MAG-BERT, LoRA, T5, SHAP, PyTorch]
  links: { code: "https://github.com/Asif190/EEE-402-AIML-project", paper: "https://ieeexplore.ieee.org/document/11491303" }

- title: "AstroVeritas: machine-learning vetting of exoplanet transit candidates"
  area: Machine learning for science
  glyph: lightcurve          # drone | lesion | fusion | qubit | chip | text | shift | lightcurve
  year: "2025"
  summary: >-
    Built with Team Beyond Kepler for the NASA Space Apps Challenge 2025. The pipeline ingests TESS light curves,
    injects synthetic transits to create labelled training signals, extracts features and classifies
    candidates with LightGBM, and is served through a web app.
  metrics: []
  tags: [TESS, LightGBM, Time series, Synthetic injection]
  links: { code: "https://github.com/Asif190/Team-Beyond-Kepler-NASA-space-app-challenge-2025-", demo: "https://astroveritas.vercel.app/" }

- title: "Breast cancer detection with GMM-HMRF segmentation and PCA-optimised classifiers"
  area: Medical image analysis
  glyph: lesion          # drone | lesion | fusion | qubit | chip | text | shift | lightcurve
  year: "2024 – 2025"
  summary: >-
    A mammogram pipeline on CBIS-DDSM and a private dataset: adaptive median filtering and CLAHE, lesion
    segmentation with a Gaussian mixture model regularised by a hidden Markov random field, texture, shape and
    frequency features reduced by PCA (95% variance), and PNN, SVM, random-forest and neural-network classifiers,
    deployed as a real-time Streamlit app. Published at ICCIT 2025.
  metrics: ["SVM: 83.3% accuracy, 0.98 AUC"]
  tags: [MATLAB, Python, GMM-HMRF, PCA, SVM, Streamlit]
  links: { code: "https://github.com/Asif190/EEE-312-Matlab-Project", paper: "https://ieeexplore.ieee.org/document/11490289" }

