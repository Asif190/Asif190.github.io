# Awards & Honours page (/awards/). Every entry here is backed by a certificate or a public record.
# certificate: base name of an image in assets/img/awards/ (needs NAME.jpg and NAME-thumb.jpg). Leave "" if none.
# outcomes: optional links shown under the entry.

featured:
  title: "Third Prize (Second Runner-Up), IEEE SPS Video and Image Processing Cup 2025"
  org: "IEEE Signal Processing Society"
  where: "Final held at IEEE ICIP 2025, Anchorage, Alaska, USA"
  date: "14 September 2025"
  scope: "International"
  challenge: "Infrared–Visual Fusion for Enhanced Drone Detection, Tracking and Payload Identification in Surveillance Videos"
  team: "Team EyeQ, BUET"
  supervisor: "Prof. Shaikh Anowarul Fattah"
  mentor: "Anjan Kumar Bagchi"
  members: "Sudipto Sarkar, Mohammad Asif Hasan, Fabliha Labiba, Nahian Tasnim, Khondokar Ashik Shahriar"
  system: >-
    Our system, DeepDroneTrack, has three stages: a lightweight YOLOv8n detector with Ghost modules and
    EMA attention working on RGB and infrared frames, ByteTrack-based multi-object tracking tuned for the
    infrared stream with a direction-of-motion estimate for each track, and an RGB + infrared early-fusion
    classifier that labels each detected drone's payload as harmful or normal.
  my_role: "I built the team's custom YOLOv8 detector, including the Ghost and EMA modules and the RGB–IR data pipeline, and the drone-payload recognition model."
  certificate: vip-cup-2025
  team_photo: team-eyeq          # assets/img/awards/team-eyeq.jpg (+ -thumb.jpg)
  outcomes:
    - text: "EGD-YOLO preprint (arXiv:2510.10765)"
      url: "https://arxiv.org/abs/2510.10765"
    - text: "Real-time multimodal tracking paper, IEEE WIECON-ECE 2025"
      url: "https://ieeexplore.ieee.org/document/11526317"
    - text: "Follow-up manuscript on weighted fusion of RGB and thermal detectors (in preparation)"
      url: "/publications/"
  also: "ICIP 2025 Travel Grant (see below)"

