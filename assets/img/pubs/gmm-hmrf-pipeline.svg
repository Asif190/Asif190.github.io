<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>GMM-HMRF breast cancer classification pipeline (schematic)</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0b7480"/>
    </marker>
    <radialGradient id="tissue" cx="38%" cy="55%" r="70%">
      <stop offset="0" stop-color="#d9e2e6"/><stop offset=".55" stop-color="#8b9aa3"/><stop offset="1" stop-color="#1c262d"/>
    </radialGradient>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="600" fill="#15202a">GMM–HMRF segmentation and PCA-optimised classification</text>
  <text x="40" y="80" font-size="16" fill="#56636e">Method overview · ICCIT 2025 · schematic drawn from the released MATLAB code</text>

  <!-- stage 1: input + preprocessing -->
  <g transform="translate(40,120)">
    <rect width="200" height="190" rx="14" fill="#f3f5f6" stroke="#d6dde2"/>
    <rect x="20" y="18" width="160" height="120" rx="6" fill="#0f1a22"/>
    <path d="M20 18h160v120c-30 6-70 6-100-6C52 120 30 96 20 70z" fill="url(#tissue)"/>
    <circle cx="96" cy="78" r="9" fill="#f4f7f8" opacity=".85"/>
    <text x="100" y="160" font-size="15" font-weight="600" fill="#15202a" text-anchor="middle">Mammogram</text>
    <text x="100" y="179" font-size="13" fill="#56636e" text-anchor="middle">adaptive median filter</text>
  </g>

  <!-- stage 2: GMM init -->
  <g transform="translate(300,120)">
    <rect width="270" height="190" rx="14" fill="#f3f5f6" stroke="#d6dde2"/>
    <text x="20" y="34" font-size="15" font-weight="600" fill="#15202a">GMM initialisation</text>
    <text x="20" y="54" font-size="13" fill="#56636e">k-means seeds, intensity mixture</text>
    <path d="M20 160h230" stroke="#9fb0ba" stroke-width="1.5"/>
    <path d="M24 160c20 0 26-70 44-70s24 70 44 70" fill="#0b7480" fill-opacity=".18" stroke="#0b7480" stroke-width="2"/>
    <path d="M86 160c22 0 30-88 52-88s30 88 52 88" fill="#3fc1cb" fill-opacity=".18" stroke="#3fc1cb" stroke-width="2"/>
    <path d="M150 160c22 0 30-50 50-50s28 50 46 50" fill="#075e68" fill-opacity=".18" stroke="#075e68" stroke-width="2"/>
    <text x="20" y="182" font-size="12" fill="#56636e">pixel intensity</text>
  </g>

  <!-- stage 3: HMRF-EM -->
  <g transform="translate(630,120)">
    <rect width="290" height="190" rx="14" fill="#f3f5f6" stroke="#d6dde2"/>
    <text x="20" y="34" font-size="15" font-weight="600" fill="#15202a">HMRF–EM segmentation</text>
    <text x="20" y="54" font-size="13" fill="#56636e">MRF-MAP labels with spatial smoothness</text>
    <g transform="translate(24,70)">
      <g fill="#d9ecee" stroke="#ffffff" stroke-width="2">
        <rect x="0" y="0" width="22" height="22"/><rect x="22" y="0" width="22" height="22"/><rect x="44" y="0" width="22" height="22"/><rect x="66" y="0" width="22" height="22"/><rect x="88" y="0" width="22" height="22"/>
        <rect x="0" y="22" width="22" height="22"/><rect x="88" y="22" width="22" height="22"/>
        <rect x="0" y="44" width="22" height="22"/><rect x="88" y="44" width="22" height="22"/>
        <rect x="0" y="66" width="22" height="22"/><rect x="22" y="66" width="22" height="22"/><rect x="66" y="66" width="22" height="22"/><rect x="88" y="66" width="22" height="22"/>
      </g>
      <g fill="#3fc1cb" stroke="#ffffff" stroke-width="2">
        <rect x="22" y="22" width="22" height="22"/><rect x="66" y="22" width="22" height="22"/><rect x="22" y="44" width="22" height="22"/><rect x="66" y="44" width="22" height="22"/><rect x="44" y="66" width="22" height="22"/>
      </g>
      <rect x="44" y="22" width="22" height="44" fill="#0b7480" stroke="#ffffff" stroke-width="2"/>
      <path d="M128 44h34" stroke="#0b7480" stroke-width="2.5" marker-end="url(#ah)"/>
      <g transform="translate(176,0)">
        <rect width="88" height="88" fill="#0f1a22" rx="4"/>
        <path d="M20 46c3-18 30-24 44-12 11 10 9 28-5 34-14 6-35 4-39-8-1.5-4-1-9 0-14z" fill="#3fc1cb"/>
      </g>
    </g>
  </g>

  <!-- arrows row 1 -->
  <path d="M244 215h50" stroke="#0b7480" stroke-width="2.5" marker-end="url(#ah)"/>
  <path d="M574 215h50" stroke="#0b7480" stroke-width="2.5" marker-end="url(#ah)"/>
  <path d="M775 314v40c0 14-10 22-24 22H200c-14 0-24 8-24 22v28" fill="none" stroke="#0b7480" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- stage 4: features -->
  <g transform="translate(40,430)">
    <rect width="270" height="130" rx="14" fill="#f3f5f6" stroke="#d6dde2"/>
    <text x="20" y="34" font-size="15" font-weight="600" fill="#15202a">Texture features</text>
    <text x="20" y="54" font-size="13" fill="#56636e">GLCM statistics and wavelet</text>
    <text x="20" y="72" font-size="13" fill="#56636e">coefficients from the segmented region</text>
    <g transform="translate(20,86)" fill="#0b7480">
      <rect x="0" y="16" width="14" height="14" opacity=".35"/><rect x="18" y="8" width="14" height="22" opacity=".55"/><rect x="36" y="2" width="14" height="28" opacity=".8"/><rect x="54" y="12" width="14" height="18" opacity=".5"/><rect x="72" y="6" width="14" height="24" opacity=".7"/><rect x="90" y="18" width="14" height="12" opacity=".4"/>
    </g>
  </g>
  <!-- stage 5: PCA -->
  <g transform="translate(360,430)">
    <rect width="250" height="130" rx="14" fill="#f3f5f6" stroke="#d6dde2"/>
    <text x="20" y="34" font-size="15" font-weight="600" fill="#15202a">PCA</text>
    <text x="20" y="54" font-size="13" fill="#56636e">compact, decorrelated features</text>
    <g transform="translate(30,70)">
      <g fill="#3fc1cb" opacity=".8">
        <circle cx="10" cy="44" r="3"/><circle cx="26" cy="36" r="3"/><circle cx="40" cy="34" r="3"/><circle cx="54" cy="24" r="3"/><circle cx="70" cy="20" r="3"/><circle cx="86" cy="12" r="3"/><circle cx="36" cy="44" r="3"/><circle cx="62" cy="30" r="3"/><circle cx="96" cy="8" r="3"/><circle cx="20" cy="48" r="3"/>
      </g>
      <path d="M0 52 108 2" stroke="#0b7480" stroke-width="2.5" marker-end="url(#ah)"/>
      <path d="M44 14 64 42" stroke="#075e68" stroke-width="1.8" stroke-dasharray="4 3"/>
    </g>
  </g>
  <!-- stage 6: classifier -->
  <g transform="translate(660,430)">
    <rect width="260" height="130" rx="14" fill="#0b7480"/>
    <text x="20" y="34" font-size="15" font-weight="600" fill="#ffffff">ML classifiers</text>
    <text x="20" y="54" font-size="13" fill="#d9ecee">real-time screening support</text>
    <g font-size="13" font-weight="600">
      <rect x="20" y="74" width="66" height="30" rx="15" fill="#ffffff"/><text x="53" y="94" text-anchor="middle" fill="#0b7480">Normal</text>
      <rect x="94" y="74" width="68" height="30" rx="15" fill="#ffffff"/><text x="128" y="94" text-anchor="middle" fill="#0b7480">Benign</text>
      <rect x="170" y="74" width="76" height="30" rx="15" fill="#ffffff"/><text x="208" y="94" text-anchor="middle" fill="#0b7480">Malignant</text>
    </g>
  </g>
  <path d="M314 495h40" stroke="#0b7480" stroke-width="2.5" marker-end="url(#ah)"/>
  <path d="M614 495h40" stroke="#0b7480" stroke-width="2.5" marker-end="url(#ah)"/>
</svg>
